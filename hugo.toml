baseURL = "https://zsbyqx20.github.io/"
locale = "en-us"
title = "Zacharite"
theme = "zacharite"
enableRobotsTXT = true

[markup]
  [markup.highlight]
    noClasses = false

[pagination]
  pagerSize = 6

[taxonomies]
  tag = "tags"

[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]

[params]
  author = "Zacharyvixx 👋"
  # description feeds meta tags; tagline (unset) would show under the site title.
  description = "A PhD student in THU AIR, majoring in AIoT. Love writing."
  homeOneLineBio = "A PhD student in THU AIR, majoring in AIoT. Love writing."
  homeRecentPostsCount = 5
  github = "https://github.com/Zsbyqx20"
  linkedin = "https://www.linkedin.com/in/gh-liu-zachary/"
  email = "gh-liu24@mails.tsinghua.edu.cn"
  homeAvatar = "avatar.svg"
  [params.robots]
    blockAllBots = true
    blockAIBots = true
  [params.theme]
    enableToggle = true
    default = "auto"
    storageKey = "zacharite-theme"

  [params.codeBlocks]
    lightStyle = "github"
    darkStyle = "onedark"

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10

  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 20

  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 30

  [[menus.main]]
    name = "Search"
    pageRef = "/search"
    weight = 40
